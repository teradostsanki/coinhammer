<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoinHammer</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root{
  --bg:#070a0f;
  --bg2:#0c1119;
  --card:#101722;
  --card2:#141d29;
  --border:#202c3b;
  --text:#f7f9fc;
  --muted:#8b97a8;
  --gold:#f5c451;
  --gold2:#ffdc78;
  --green:#36d98a;
  --red:#ff5f6d;
  --blue:#4da3ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,#182434 0,#0b1018 34%,#070a0f 72%);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

main{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:18px 16px 40px;
}

/* ================= HERO ================= */

.hero{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(145deg,#172231 0%,#0d141e 55%,#0a1018 100%);
  border:1px solid #263547;
  border-radius:28px;
  padding:25px 22px 22px;
  box-shadow:
    0 18px 50px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.hero:before{
  content:"";
  position:absolute;
  width:210px;
  height:210px;
  right:-105px;
  top:-115px;
  border-radius:50%;
  background:rgba(245,196,81,.12);
  filter:blur(2px);
}

.hero:after{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  left:-80px;
  bottom:-90px;
  border-radius:50%;
  background:rgba(77,163,255,.06);
}

.brand{
  position:relative;
  z-index:2;
  color:var(--gold);
  font-size:15px;
  font-weight:900;
  letter-spacing:4px;
  text-align:left;
}

.balance{
  position:relative;
  z-index:2;
  margin-top:12px;
  font-size:48px;
  line-height:1;
  font-weight:900;
  letter-spacing:-2px;
}

.hero .muted{
  position:relative;
  z-index:2;
  margin-top:7px;
  font-size:13px;
  letter-spacing:1px;
}

/* ================= BUTTON ================= */

button{
  border:0;
  font-family:inherit;
  border-radius:15px;
  padding:14px 16px;
  font-weight:800;
  cursor:pointer;
  transition:
    transform .18s ease,
    opacity .18s ease,
    border-color .18s ease,
    background .18s ease;
}

button:active{
  transform:scale(.97);
}

.earn{
  position:relative;
  z-index:2;
  width:100%;
  margin-top:23px;
  padding:17px;
  border-radius:17px;
  background:
    linear-gradient(135deg,var(--gold2),var(--gold));
  color:#171208;
  font-size:16px;
  font-weight:900;
  box-shadow:
    0 10px 28px rgba(245,196,81,.18);
}

.earn:disabled{
  opacity:.55;
}

#timer{
  position:relative;
  z-index:2;
}

/* ================= NOTICE ================= */

.notice{
  min-height:22px;
  margin:13px 0 4px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* ================= QUICK ACTIONS ================= */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.card{
  position:relative;
  overflow:hidden;
  width:100%;
  min-height:116px;
  padding:18px;
  background:
    linear-gradient(145deg,var(--card2),var(--card));
  border:1px solid var(--border);
  border-radius:20px;
  color:var(--text);
  text-align:left;
  box-shadow:
    0 8px 25px rgba(0,0,0,.14),
    inset 0 1px 0 rgba(255,255,255,.025);
}

.card:before{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  right:-35px;
  bottom:-35px;
  border-radius:50%;
  background:rgba(255,255,255,.025);
}

.card:active{
  transform:scale(.98);
  border-color:#34465b;
}

.icon{
  position:relative;
  z-index:1;
  font-size:25px;
  line-height:1;
}

.title{
  position:relative;
  z-index:1;
  margin-top:12px;
  font-size:16px;
  font-weight:850;
  letter-spacing:-.2px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.card .muted{
  position:relative;
  z-index:1;
  margin-top:4px;
  line-height:1.35;
}

/* ================= PANELS ================= */

.panel{
  display:none;
  margin-top:15px;
  padding:20px;
  background:
    linear-gradient(145deg,#141d29,#0e151f);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.22);
}

.panel.show{
  display:block;
}

.panel h3{
  margin:0 0 12px;
  font-size:19px;
  font-weight:900;
}

.panel .muted{
  line-height:1.5;
}

/* ================= INPUTS ================= */

input{
  width:100%;
  margin:8px 0;
  padding:14px 15px;
  border:1px solid #273446;
  border-radius:13px;
  outline:none;
  background:#0a1018;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
}

input::placeholder{
  color:#697687;
}

input:focus{
  border-color:#52677f;
  box-shadow:0 0 0 3px rgba(77,163,255,.07);
}

/* ================= PANEL BUTTONS ================= */

.panel button{
  width:100%;
  margin-top:8px;
  background:linear-gradient(135deg,#f8cf62,#eeb63d);
  color:#171208;
}

.panel button:active{
  transform:scale(.98);
}

/* ================= WITHDRAW ================= */

.withdraw-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:17px;
}

.withdraw-options .card{
  min-height:125px;
  padding:18px;
}

.withdraw-options .card:hover{
  border-color:#34465b;
}

#bankForm,
#upiForm{
  margin-top:14px;
}

/* ================= OUTPUT ================= */

#output{
  line-height:1.6;
}

#output.show{
  display:block;
}

#output h3{
  margin-top:0;
}

#output > div{
  margin:9px 0;
}

/* ================= TASKS ================= */

#output button{
  margin-top:10px;
  background:#1b2736;
  color:var(--text);
  border:1px solid #2b3a4d;
}

#output button:active{
  background:#243449;
}

/* ================= REFERRAL ================= */

#refLink{
  margin-top:10px;
  padding:13px;
  border-radius:12px;
  background:#0a1018;
  border:1px solid var(--border);
  color:var(--gold2);
  word-break:break-all;
  font-size:13px;
}

/* ================= LEADERBOARD ================= */

#output h3 + div{
  color:var(--text);
}

/* ================= MOBILE ================= */

@media(max-width:420px){

  main{
    padding:14px 12px 32px;
  }

  .hero{
    padding:22px 18px 19px;
    border-radius:24px;
  }

  .brand{
    font-size:14px;
    letter-spacing:3px;
  }

  .balance{
    font-size:43px;
  }

  .earn{
    margin-top:20px;
    padding:16px;
  }

  .grid{
    gap:10px;
  }

  .card{
    min-height:108px;
    padding:16px;
    border-radius:18px;
  }

  .icon{
    font-size:23px;
  }

  .title{
    font-size:15px;
    margin-top:10px;
  }

  .muted{
    font-size:12px;
  }

  .panel{
    padding:17px;
    border-radius:19px;
  }
}

/* ================= SMALL POLISH ================= */

::selection{
  background:rgba(245,196,81,.22);
}

button,
input{
  -webkit-appearance:none;
  appearance:none;
}

button:focus-visible,
input:focus-visible{
  outline:2px solid rgba(245,196,81,.45);
  outline-offset:2px;
  }
</style>
</head>
<body><main>
<section class="hero">
<div class="brand">◆ COINHAMMER</div>
<div class="balance" id="balance">0</div><div class="muted">COINS</div>
<button class="earn" id="earn">🚀 START EARNING</button>
<div class="muted" id="timer">Ready</div>
</section>
<div class="grid">
<button class="card" id="daily"><div class="icon">🎁</div><div class="title">Daily Bonus</div><div class="muted">Claim once per day</div></button>
<button class="card" id="tasks"><div class="icon">🎯</div><div class="title">Tasks</div><div class="muted">Complete & earn</div></button>
<button class="card" id="invite"><div class="icon">👥</div><div class="title">Invite Friends</div><div class="muted">Referral rewards</div></button>
<button class="card" id="leader">
  <div class="icon">🏆</div>
  <div class="title">Leaderboard</div>
  <div class="muted">Top earners</div>
</button>

<button class="card" id="withdraw">
  <div class="icon">💰</div>
  <div class="title">Withdraw</div>
  <div class="muted">Cash out coins</div>
</button></div>
<section class="panel" id="wallet">
  <h3>💰 Withdraw</h3>

  <div class="muted">
    Minimum withdrawal ₹10 • Maximum 2 withdrawals per day
  </div>

  <div class="withdraw-options">

    <button class="card" id="bankOption" type="button">
      <div class="icon">🏦</div>
      <div class="title">Bank Account</div>
      <div class="muted">Withdraw to your bank account</div>
    </button>

    <button class="card" id="upiOption" type="button">
      <div class="icon">📱</div>
      <div class="title">UPI</div>
      <div class="muted">Withdraw using UPI</div>
    </button>

  </div>

  <div class="card" id="bankForm" style="display:none;">
    <h3>🏦 Bank Account</h3>

    <input id="bankName" type="text" placeholder="Account Holder Name">
    <input id="bankAccount" type="text" placeholder="Account Number">
    <input id="bankIfsc" type="text" placeholder="IFSC Code">
    <input id="bankAmount" type="number" min="10" placeholder="Withdrawal Amount ₹">

    <button id="bankWithdraw" type="button">
      🏦 Submit Withdrawal Request
    </button>
  </div>

  <div class="card" id="upiForm" style="display:none;">
    <h3>📱 UPI Withdrawal</h3>

    <input id="upiId" type="text" placeholder="UPI ID (example@upi)">
    <input id="upiAmount" type="number" min="10" placeholder="Withdrawal Amount ₹">

    <button id="upiWithdraw" type="button">
      📱 Submit Withdrawal Request
    </button>
  </div>

  <div class="muted">
    ⏳ Withdrawal requests are sent for admin approval.
  </div>
</section>
<section class="panel" id="output"></section>
<div class="notice" id="notice" aria-live="polite"></div>
</main>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const api="https://coinhammer.onrender.com";
const AdController=window.Adsgram.init({blockId:"48321"});
const tgUser=tg?.initDataUnsafe?.user;
const id=String(tgUser?.id||"demo-user");
const name=tgUser?.username||tgUser?.first_name||"DemoUser";
const $=x=>document.getElementById(x);
let balance=0;
async function load(){try{const r=await fetch(api+"/api/user/"+encodeURIComponent(id));const u=await r.json();balance=u.balance;render()}catch(e){balance=1250;render();$("notice").textContent="Demo mode — connect the backend for real data."}}
function render(){$("balance").textContent=balance.toLocaleString("en-IN")}
async function post(path,body){const r=await fetch(api+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||"Request failed");return j}
$("earn").onclick=async()=>{$("earn").disabled=true;$("timer").textContent="Opening rewarded ad...";try{const result=await AdController.show();if(!result?.done){$("timer").textContent="Ad not completed — no reward";return}const j=await post("/api/earn",{id});balance=j.balance;render();$("timer").textContent="+100 coins"}catch(e){$("notice").textContent=e.message;setTimeout(()=>$("notice").textContent="",3000)}finally{$("earn").disabled=false}}
$("daily").onclick=async()=>{$("output").classList.remove("show");$("output").style.display="none";try{const j=await post("/api/daily",{id});balance=j.balance;render();$("notice").textContent="+250 daily bonus";setTimeout(()=>$("notice").textContent="",3000)}catch(e){$("notice").textContent=e.message;setTimeout(()=>$("notice").textContent="",3000)}}
$("invite").onclick=async()=>{try{const j=await (await fetch(api+"/api/referral/"+encodeURIComponent(id))).json();$("output").classList.add("show");$("output").innerHTML="<h3>👥 Your Referral Link</h3><div class='muted' id='refLink'>"+j.link+"</div><button id='copyRef' style='margin-top:12px;width:100%'>📋 Copy Referral Link</button>";$("copyRef").onclick=async()=>{await navigator.clipboard.writeText(j.link);$("copyRef").textContent="✅ Copied!"}}catch(e){$("notice").textContent=e.message}}
$("tasks").onclick=async()=>{
  try{
    const r=await fetch(api+"/api/tasks");
    const j=await r.json();

    $("output").style.display="block";
    $("output").innerHTML="<h3>📋 Tasks</h3>"+j.tasks.map(t=>
      `<div style="padding:12px;margin:8px 0;background:#1b2230;border-radius:12px">
        <b>${t.title}</b>
        <div class="muted">Reward: ${t.reward} COIN</div>
        <button onclick="completeTask('${t.id}')">✅ Complete</button>
      </div>`
    ).join("");
  }catch(e){
    $("notice").textContent="Unable to load tasks";
  }
};

async function completeTask(taskId){
  try{
    const j=await post("/api/tasks/complete",{id,taskId});

    if(j.error){
      $("notice").textContent=j.error;
      setTimeout(()=>$("notice").textContent="",3000);
      return;
    }

    $("notice").textContent="Task completed! +" + (j.reward||0) + " COIN";
    setTimeout(()=>$("notice").textContent="",3000);
    await load();
  }catch(e){
  $("notice").textContent=e.message;
  setTimeout(()=>$("notice").textContent="",3000);
}
}
  $("withdraw").onclick=()=>{$("wallet").classList.add("show");$("wallet").scrollIntoView({behavior:"smooth"});}
$("bankOption").onclick=()=>{
  $("bankForm").style.display="block";
  $("upiForm").style.display="none";
};

$("upiOption").onclick=()=>{
  $("upiForm").style.display="block";
  $("bankForm").style.display="none";
};
  async function submitWithdrawal(method){
  try{
    let amount=0;
    let body={id,method};

    if(method==="bank"){
      const accountHolderName=$("bankName").value.trim();
      const accountNumber=$("bankAccount").value.trim();
      const ifsc=$("bankIfsc").value.trim();
      amount=Number($("bankAmount").value);

      if(!accountHolderName||!accountNumber||!ifsc||amount<10){
        throw new Error("Please fill all bank details and minimum ₹10");
      }

      body.accountHolderName=accountHolderName;
      body.accountNumber=accountNumber;
      body.ifsc=ifsc;
    }

    if(method==="upi"){
      const upiId=$("upiId").value.trim();
      amount=Number($("upiAmount").value);

      if(!upiId||amount<10){
        throw new Error("Please enter UPI ID and minimum ₹10");
      }

      body.upiId=upiId;
    }

    body.amount=amount;

    const j=await post("/api/withdraw",body);

    balance=j.balance;
    render();

    $("notice").textContent="✅ Withdrawal request submitted successfully";

    if(method==="bank"){
      $("bankAmount").value="";
    }else{
      $("upiAmount").value="";
    }

    setTimeout(()=>$("notice").textContent="",3000);

  }catch(e){
    $("notice").textContent="❌ "+e.message;
    setTimeout(()=>$("notice").textContent="",3000);
  }
}

$("bankWithdraw").onclick=()=>submitWithdrawal("bank");
$("upiWithdraw").onclick=()=>submitWithdrawal("upi");
$("leader").onclick=async()=>{try{const list=await (await fetch(api+"/api/leaderboard")).json();$("output").classList.add("show");$("output").innerHTML="<h3>🏆 Leaderboard</h3>"+list.map((u,i)=>"<div>"+(i+1)+". "+(u.username||"User")+" — "+u.balance.toLocaleString()+"</div>").join("")}catch(e){$("notice").textContent=e.message}}
  load();
</script>
</body></html>
